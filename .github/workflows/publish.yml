name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: set up node and pnpm
        run: |
          corepack enable
          pnpm i

      - name: publish
        run: pnpm publish --no-git-checks --access public